[project]
name = "research-navigator"
version = "0.2.0"
description = "A local research discovery workspace with validated metadata and cited explanations"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "sqlalchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4",
  "httpx[socks]>=0.27,<1",
  "pydantic>=2.8,<3",
  "python-dotenv>=1.0,<2",
  "alembic>=1.18,<2",
  "anyio>=4.14.2,<5",
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "pytest-cov>=7,<8"]
dev = ["ruff>=0.16,<0.17", "pip-audit>=2.10,<3", "pip-tools>=7,<8"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["backend*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 120
extend-exclude = ["evaluation/reports", "node_modules"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.coverage.run]
source = ["backend/app"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 80

