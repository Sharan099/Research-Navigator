services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: research
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-research-local-only}
      POSTGRES_DB: research
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - research_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U research -d research"]
      interval: 5s
      timeout: 5s
      retries: 10
  web:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://research:${POSTGRES_PASSWORD:-research-local-only}@db:5432/research
      OPENALEX_API_KEY: ${OPENALEX_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-openai/gpt-oss-120b,openai/gpt-oss-20b}
      GROQ_REQUESTS_PER_DAY: ${GROQ_REQUESTS_PER_DAY:-6}
      CACHE_TTL_HOURS: ${CACHE_TTL_HOURS:-24}
      AI_TURNS_PER_DAY: ${AI_TURNS_PER_DAY:-3}
      GEMINI_REQUESTS_PER_DAY: ${GEMINI_REQUESTS_PER_DAY:-6}
      OPENALEX_REQUESTS_PER_DAY: ${OPENALEX_REQUESTS_PER_DAY:-20}
      PROVIDER_CONCURRENCY: ${PROVIDER_CONCURRENCY:-2}
      PROVIDER_ATTEMPTS: ${PROVIDER_ATTEMPTS:-2}
      PROVIDER_TIMEOUT_SECONDS: ${PROVIDER_TIMEOUT_SECONDS:-20}
      REQUEST_TIMEOUT_SECONDS: ${REQUEST_TIMEOUT_SECONDS:-60}
      MAX_ACTIVE_REQUESTS: ${MAX_ACTIVE_REQUESTS:-5}
      MAX_RESPONSE_BYTES: ${MAX_RESPONSE_BYTES:-4000000}
      CHAT_RETENTION_DAYS: ${CHAT_RETENTION_DAYS:-30}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    stop_grace_period: 45s

volumes:
  research_pgdata:

